apiVersion: v1
kind: Secret
metadata:
  name: cloudfind-secret
  namespace: cloudfind
type: Opaque
stringData:
  # Database — points to in-cluster PostgreSQL StatefulSet service
  DATABASE_URL: "postgresql+asyncpg://postgres:<REPLACE_WITH_DB_PASSWORD>@cloudfind-postgres:5432/lost_and_found"
  POSTGRES_PASSWORD: "<REPLACE_WITH_DB_PASSWORD>"

  # Redis — points to in-cluster Redis StatefulSet service
  REDIS_URL: "redis://cloudfind-redis:6379/0"

  # Application JWT secret — cryptographically strong
  SECRET_KEY: "<REPLACE_WITH_JWT_SECRET_KEY>"

  # SMTP — Replace with real App Password for production SMTP
  SMTP_PASSWORD: "<REPLACE_WITH_SMTP_PASSWORD>"

  # MinIO object storage credentials (S3-compatible)
  MINIO_ROOT_USER: "<REPLACE_WITH_MINIO_USER>"
  MINIO_ROOT_PASSWORD: "<REPLACE_WITH_MINIO_PASSWORD>"
  S3_ACCESS_KEY: "<REPLACE_WITH_MINIO_USER>"
  S3_SECRET_KEY: "<REPLACE_WITH_MINIO_PASSWORD>"
