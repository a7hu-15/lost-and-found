apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudfind-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  rules:
  - host: cloudfind.university.edu
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cloudfind-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudfind-frontend-service
            port:
              number: 80
