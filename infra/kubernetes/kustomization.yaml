apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply all manifests in the correct dependency order
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - minio-statefulset.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - monitoring.yaml
  - network-policies.yaml
  - kubelet-policy.yaml
