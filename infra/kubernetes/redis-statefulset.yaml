---
# Redis PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: cloudfind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudfind-redis
  namespace: cloudfind
  labels:
    app: cloudfind-redis
spec:
  serviceName: cloudfind-redis
  replicas: 1
  selector:
    matchLabels:
      app: cloudfind-redis
  template:
    metadata:
      labels:
        app: cloudfind-redis
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            timeoutSeconds: 5
            failureThreshold: 12
            periodSeconds: 5
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
---
# Redis Headless Service
apiVersion: v1
kind: Service
metadata:
  name: cloudfind-redis
  namespace: cloudfind
  labels:
    app: cloudfind-redis
spec:
  clusterIP: None
  selector:
    app: cloudfind-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
