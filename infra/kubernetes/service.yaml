apiVersion: v1
kind: Service
metadata:
  name: cloudfind-backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: cloudfind-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: cloudfind-frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: cloudfind-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
