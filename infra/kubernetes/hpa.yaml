---
# Horizontal Pod Autoscaler — backend scales 2–10 replicas based on CPU/memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudfind-backend-hpa
  namespace: cloudfind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudfind-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120  # Wait 2 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
