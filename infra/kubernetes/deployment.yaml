apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudfind-backend
  namespace: default
  labels:
    app: cloudfind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudfind-backend
  template:
    metadata:
      labels:
        app: cloudfind-backend
    spec:
      containers:
      - name: backend
        image: cloudfind-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: cloudfind-config
        - secretRef:
            name: cloudfind-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudfind-frontend
  namespace: default
  labels:
    app: cloudfind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudfind-frontend
  template:
    metadata:
      labels:
        app: cloudfind-frontend
    spec:
      containers:
      - name: frontend
        image: cloudfind-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
